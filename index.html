<script>
(function(){
  "use strict";

  const $ = (sel, el) => (el \vert{}\vert{} document).querySelector(sel);   const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

  let toastTimer = null;
  function toast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function describeError(err){
    if(!err) return 'Penyebab tidak diketahui';
    const msg = err.message || err.error_description || err.statusText || String(err);
    if(/row-level security|RLS/i.test(msg)) return 'Akses RLS database/storage belum diizinkan';
    if(/Bucket not found/i.test(msg)) return 'Bucket "dpm-files" belum dibuat di Supabase';
    if(/Failed to fetch|NetworkError|CORS/i.test(msg)) return 'Tidak dapat menghubungi Supabase — cek jaringan';
    if(/JWT|Invalid API key|apikey/i.test(msg)) return 'SUPABASE_ANON_KEY tidak valid';
    if(/relation .* does not exist/i.test(msg)) return 'Tabel "dpm" belum tersedia';
    return msg;
  }

  function slugify(s){
    return (s || '').toString().trim().toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'industri';
  }

  function todayISO(d){ d = d || new Date(); return d.toISOString().slice(0, 10); }

  function fmtTanggal(iso, jam){
    if(!iso) return '—';
    const [y, m, d] = iso.split('-');
    const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return `${parseInt(d, 10)} ${bulan[parseInt(m, 10) - 1]} ${y}` + (jam ? ' · ' + jam : '');
  }

  /* Configuration */
  const SUPABASE_URL = 'https://gjfkulhavzpffnpvfmel.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmt1bGhhdnpwZmZucHZmbWVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3ODc5NjQsImV4cCI6MjEwNTM2Mzk2NH0.jfVgsZSy6Kk2NPkBvIOttLee-cIKd8yem9PxqpxyT_o';
  const STORAGE_BUCKET = 'dpm-files';

  let sb = null, capReady = false;
  let activeTab = 'lapangan';
  let currentFilter = 'all';
  let selectedRecord = null;
  let rawPhotoFile = null;

  // Signatures canvas state
  const sigPads = { pencatat: null, perwakilan: null };
  const sigDrawn = { pencatat: false, perwakilan: false };

  async function initCapabilities(){
    try {
      if (typeof supabase === 'undefined') throw new Error("Library Supabase belum dimuat.");
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      // Tes Koneksi
      const { data, error } = await sb.from('dpm').select('id').limit(1);
      if(error && !error.message.includes('0 rows')) throw error;

      $('#connDot').className = 'conn-dot ok';
      $('#connText').textContent = 'Terhubung';
      capReady = true;
      loadKantorData();
    } catch(err) {
      $('#connDot').className = 'conn-dot off';
      $('#connText').textContent = 'Offline / Error';
      console.error("Inisialisasi Supabase Gagal:", err);
    }
  }

  /* Canvas Signature Handlers */
  function setupSignaturePads(){
    $$('.sig-pad-wrap').forEach(wrap => {       const type = wrap.dataset.sig;       const canvas = wrap.querySelector('canvas');       const ctx = canvas.getContext('2d');        function resize(){         const rect = wrap.getBoundingClientRect();         canvas.width = rect.width;         canvas.height = 140;         ctx.lineWidth = 2.5;         ctx.lineCap = 'round';         ctx.strokeStyle = '#0F3854';       }       resize();       window.addEventListener('resize', resize);        let drawing = false;       function getPos(e){         const rect = canvas.getBoundingClientRect();         const clientX = e.touches ? e.touches[0].clientX : e.clientX;         const clientY = e.touches ? e.touches[0].clientY : e.clientY;         return { x: clientX - rect.left, y: clientY - rect.top };       }        function start(e){         drawing = true;         const pos = getPos(e);         ctx.beginPath();         ctx.moveTo(pos.x, pos.y);         wrap.querySelector('.sig-empty-hint').style.display = 'none';         sigDrawn[type] = true;       }        function move(e){         if(!drawing) return;         const pos = getPos(e);         ctx.lineTo(pos.x, pos.y);         ctx.stroke();       }        function stop(){ drawing = false; }        canvas.addEventListener('mousedown', start);       canvas.addEventListener('mousemove', move);       window.addEventListener('mouseup', stop);        canvas.addEventListener('touchstart', (e) => { start(e); e.preventDefault(); }, {passive: false});       canvas.addEventListener('touchmove', (e) => { move(e); e.preventDefault(); }, {passive: false});       canvas.addEventListener('touchend', stop);        sigPads[type] = { canvas, ctx, wrap };     });      $$
('[data-clear]').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.clear;
        const pad = sigPads[type];
        if(pad){
          pad.ctx.clearRect(0, 0, pad.canvas.width, pad.canvas.height);
          pad.wrap.querySelector('.sig-empty-hint').style.display = 'block';
          sigDrawn[type] = false;
        }
      });
    });
  }

  /* Input Syncing & Photo Management */
  function setupFormHandlers(){
    $('#fNamaPencatat').addEventListener('input', (e) => {
      $('#fNamaPencatat2').value = e.target.value;
    });

    const dropZone = $('#photoDropZone');
    const fileInput = $('#fotoInput');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if(e.target.files && e.target.files[0]){
        handlePhotoSelect(e.target.files[0]);
      }
    });

    $('#btnRetakePhoto').addEventListener('click', () => {
      fileInput.value = '';
      rawPhotoFile = null;
      $('#photoPreviewZone').style.display = 'none';
      dropZone.style.display = 'block';
    });

    $('#formLapangan').addEventListener('submit', handleFormSubmit);
  }

  function handlePhotoSelect(file){
    rawPhotoFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      $('#photoPreviewImg').src = e.target.result;
      $('#photoDropZone').style.display = 'none';
      $('#photoPreviewZone').style.display = 'block';
      
      const slug = slugify($('#fNamaIndustri').value || 'meter');
      const dateStr = todayISO();
      $('#photoFilenameLabel').textContent = `${slug}_${dateStr}_meter.jpg`;
    };
    reader.readAsDataURL(file);
  }

  /* Helper Upload Ke Supabase Storage */
  async function uploadToStorage(blobOrFile, path){
    const { data, error } = await sb.storage.from(STORAGE_BUCKET).upload(path, blobOrFile, {
      upsert: true,
      contentType: 'image/jpeg'
    });
    if(error) throw error;
    const { data: pubData } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return pubData.publicUrl;
  }

  function canvasToBlob(canvas){
    return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
  }

  /* Handle Form Submit */
  async function handleFormSubmit(e){
    e.preventDefault();

    if(!rawPhotoFile){
      toast('Ambil atau pilih foto stand meter terlebih dahulu!');
      return;
    }
    if(!sigDrawn.perwakilan){
      toast('Tanda tangan perwakilan industri wajib diisi!');
      return;
    }

    const btnSubmit = $('#btnSubmit');
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Mengirim Data…';

    try {
      const now = new Date();
      const dateStr = todayISO(now);
      const timeStr = now.toTimeString().slice(0, 5);
      const industriSlug = slugify($('#fNamaIndustri').value);
      const timestamp = now.getTime();

      // 1. Upload Foto Meter
      const photoPath = `meter/${dateStr}_${industriSlug}_${timestamp}.jpg`;
      const photoUrl = await uploadToStorage(rawPhotoFile, photoPath);

      // 2. Upload Tanda Tangan Pencatat
      let sigPencatatUrl = null;
      if(sigDrawn.pencatat){
        const blob = await canvasToBlob(sigPads.pencatat.canvas);
        sigPencatatUrl = await uploadToStorage(blob, `signatures/${dateStr}_${industriSlug}_pencatat_${timestamp}.jpg`);
      }

      // 3. Upload Tanda Tangan Perwakilan
      const blobPerwakilan = await canvasToBlob(sigPads.perwakilan.canvas);
      const sigPerwakilanUrl = await uploadToStorage(blobPerwakilan, `signatures/${dateStr}_${industriSlug}_perwakilan_${timestamp}.jpg`);

      // 4. Save Record to Database Table "dpm"
      const payload = {
        nama_industri: $('#fNamaIndustri').value,
        no_pelanggan: $('#fNoPelanggan').value || null,
        alamat: $('#fAlamat').value || null,
        stand_meter: parseFloat($('#fStandMeter').value) || 0,
        nama_pencatat: $('#fNamaPencatat').value,
        nama_perwakilan: $('#fNamaPerwakilan').value,
        catatan_lapangan: $('#fCatatan').value || null,
        foto_url: photoUrl,
        sig_pencatat_url: sigPencatatUrl,
        sig_perwakilan_url: sigPerwakilanUrl,
        tanggal: dateStr,
        jam: timeStr,
        status: 'pending'
      };

      const { error: dbError } = await sb.from('dpm').insert([payload]);
      if(dbError) throw dbError;

      toast('Data DPM Digital berhasil disimpan!');
      resetForm();
      switchTab('kantor');

    } catch(err) {
      console.error(err);
      toast('Gagal mengirim data: ' + describeError(err));
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Kirim DPM Digital';
    }
  }

  function resetForm(){
    $('#formLapangan').reset();
    $('#btnRetakePhoto').click();
    $$('[data-clear]').forEach(b => b.click());   }    /* Navigation Tabs */   function setupTabs(){     $$
('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.view));
    });
  }

  function switchTab(viewName){
    activeTab = viewName;
    $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === viewName));$$
('.view').forEach(v => v.classList.toggle('active', v.id === `view-${viewName}`));
    if(viewName === 'kantor') loadKantorData();
  }

  /* Dashboard Kantor Logic */
  async function loadKantorData(){
    if(!capReady) return;

    const dateVal = $('#dateFilter').value || todayISO();
    const searchVal = $('#searchInput').value.trim().toLowerCase();

    let query = sb.from('dpm').select('*').order('created_at', { ascending: false });
    if(dateVal) query = query.eq('tanggal', dateVal);

    const { data, error } = await query;
    if(error){
      console.error(error);
      return;
    }

    let records = data || [];

    // Summary Stats
    $('#statTotal').textContent = records.length;
    $('#statPending').textContent = records.filter(r => r.status === 'pending').length;
    $('#statSesuai').textContent = records.filter(r => r.status === 'sesuai').length;
    $('#statTidak').textContent = records.filter(r => r.status === 'tidak_sesuai').length;

    // Filters
    if(currentFilter !== 'all'){
      records = records.filter(r => r.status === currentFilter);
    }
    if(searchVal){
      records = records.filter(r => (r.nama_industri || '').toLowerCase().includes(searchVal));
    }

    renderList(records);
  }

  function renderList(list){
    const container = $('#kantorList');
    const emptyState = $('#kantorEmpty');
    container.innerHTML = '';

    if(list.length === 0){
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'row-card';
      
      const chipClass = item.status === 'sesuai' ? 'sesuai' : (item.status === 'tidak_sesuai' ? 'tidak_sesuai' : 'pending');
      const statusLabel = item.status === 'sesuai' ? 'Sesuai' : (item.status === 'tidak_sesuai' ? 'Tidak Sesuai' : 'Menunggu');

      card.innerHTML = `
        <img class="row-thumb" src="${item.foto_url || ''}" alt="Thumb" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22/>'">
        <div class="row-main">
          <div class="row-title">${item.nama_industri}</div>
          <div class="row-sub">
            <span>${fmtTanggal(item.tanggal, item.jam)}</span>
            <span>•</span>
            <span>${item.nama_pencatat || 'Pencatat'}</span>
          </div>
        </div>
        <div style="text-align:right">
          <div class="row-meter">${item.stand_meter} m³</div>
          <span class="chip ${chipClass}">${statusLabel}</span>
        </div>
      `;

      card.addEventListener('click', () => openDetailSheet(item));
      container.appendChild(card);
    });
  }

  /* Modal Detail & Crosscheck Sheet */
  function openDetailSheet(item){
    selectedRecord = item;
    $('#dTitle').textContent = item.nama_industri;
    
    const chipClass = item.status === 'sesuai' ? 'sesuai' : (item.status === 'tidak_sesuai' ? 'tidak_sesuai' : 'pending');
    const statusLabel = item.status === 'sesuai' ? 'Sesuai' : (item.status === 'tidak_sesuai' ? 'Tidak Sesuai' : 'Menunggu Crosscheck');
    $('#dStatusChipWrap').innerHTML = `<span class="chip ${chipClass}">${statusLabel}</span>`;

    $('#dPhoto').src = item.foto_url || '';
    $('#dMeter').textContent = `${item.stand_meter} m³`;
    $('#dWaktu').textContent = fmtTanggal(item.tanggal, item.jam);
    $('#dNoPelanggan').textContent = item.no_pelanggan || '—';
    $('#dAlamat').textContent = item.alamat || '—';
    $('#dPencatat').textContent = item.nama_pencatat || '—';
    $('#dPerwakilan').textContent = item.nama_perwakilan || '—';

    if(item.catatan_lapangan){
      $('#dCatatanWrap').style.display = 'block';
      $('#dCatatan').textContent = item.catatan_lapangan;
    } else {
      $('#dCatatanWrap').style.display = 'none';
    }

    $('#dSigPencatat').src = item.sig_pencatat_url || '';
    $('#dSigPerwakilan').src = item.sig_perwakilan_url || '';

    $('#dVerifNama').value = item.verifikator || '';
    $('#dVerifCatatan').value = item.catatan_verifikasi || '';
    $('#dVerifiedNote').textContent = item.verifikator ? `Terakhir diverifikasi oleh ${item.verifikator}` : '';

    $('#detailOverlay').classList.add('open');
  }

  function setupModalEvents(){
    $('#dClose').addEventListener('click', () => $('#detailOverlay').classList.remove('open'));
    
    $('#dPhoto').addEventListener('click', () => {
      $('#lightboxImg').src = $('#dPhoto').src;
      $('#lightbox').classList.add('open');
    });

    $('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('open'));

    $('#btnMarkSesuai').addEventListener('click', () => updateStatus('sesuai'));
    $('#btnMarkTidak').addEventListener('click', () => updateStatus('tidak_sesuai'));
    $('#btnMarkPending').addEventListener('click', () => updateStatus('pending'));

    // Filter pills
    $$('#filterPills .pill').forEach(p => {       p.addEventListener('click', () => {         $$
('#filterPills .pill').forEach(x => x.classList.remove('active'));
        p.classList.add('active');
        currentFilter = p.dataset.filter;
        loadKantorData();
      });
    });

    $('#dateFilter').value = todayISO();
    $('#dateFilter').addEventListener('change', loadKantorData);
    $('#searchInput').addEventListener('input', loadKantorData);
  }

  async function updateStatus(newStatus){
    if(!selectedRecord) return;

    if(newStatus === 'tidak_sesuai' && !$('#dVerifCatatan').value.trim()){
      toast('Wajib mengisi catatan jika menandai Tidak Sesuai!');
      return;
    }

    const verifikator = $('#dVerifNama').value.trim() || 'Petugas Kantor';
    const catatanVerif = $('#dVerifCatatan').value.trim();

    try {
      const { error } = await sb.from('dpm').update({
        status: newStatus,
        verifikator: verifikator,
        catatan_verifikasi: catatanVerif
      }).eq('id', selectedRecord.id);

      if(error) throw error;

      toast('Status berhasil diperbarui!');
      $('#detailOverlay').classList.remove('open');
      loadKantorData();
    } catch(err) {
      console.error(err);
      toast('Gagal memperbarui status: ' + describeError(err));
    }
  }

  // Inisialisasi awal saat dokumen siap
  document.addEventListener('DOMContentLoaded', () => {
    initCapabilities();
    setupSignaturePads();
    setupFormHandlers();
    setupTabs();
    setupModalEvents();
  });

})();
</script>
